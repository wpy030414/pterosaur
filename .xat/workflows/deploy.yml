requires: |
  if server.provider == 'aliyun'
    return nginx.has('music.xrl.im -> localhost:8788').uses(
      acme_sh.uses(cloudflare.dns_01)
    )
  return nothing

steps:
  - name: Check mem
    run: |
      FREE_MB=$(free -m | awk '/^Mem:/{print $7}')
      echo "可用内存: ${FREE_MB}MiB"
      if [ "$FREE_MB" -lt 4096 ]; then
        export NODE_OPTIONS="--max-old-space-size=1024"
        echo "可用不足 4GiB, 限制 Node 堆上限为 1GiB"
      else
        echo "可用充足, 正常构建"
      fi
      # 写入 .env 供后续步骤读取
      echo "NODE_OPTIONS=${NODE_OPTIONS:-}" > /tmp/_pterosaur_env
  - name: Install
    run: |
      set -a; source /tmp/_pterosaur_env 2>/dev/null; set +a
      pnpm config set confirmModulesPurge false --location project 2>/dev/null || true

      # 预检：树内若有带构建脚本、且未列入 allowBuilds 的依赖，pnpm 12 会以
      # ERR_PNPM_IGNORED_BUILDS 中断安装。这条策略随 CI 环境（服务器全局 .npmrc）
      # 而变，本地复现不到，故在安装前留一条可诊断的日志，再按真实意图安装。
      if pnpm install --frozen-lockfile 2>&1 | tee /tmp/_pterosaur_install.log; then
        echo "安装完成"
      elif grep -q ERR_PNPM_IGNORED_BUILDS /tmp/_pterosaur_install.log; then
        echo "::warning::pnpm 拒绝了部分构建脚本，改用 --dangerously-allow-all-builds 重装"
        pnpm install --frozen-lockfile --dangerously-allow-all-builds
      else
        exit 1
      fi
  - name: Build
    run: |
      set -a; source /tmp/_pterosaur_env 2>/dev/null; set +a
      pnpm build
  - name: Run
    run: |
      pm2 delete pterosaur 2>/dev/null || true
      pm2 start 'PORT=8788 pnpm start' --name pterosaur --cwd "$(pwd)"
      pm2 save
